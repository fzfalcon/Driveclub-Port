
name: Driveclub Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pyinstaller capstone pytest

      - name: Run launcher tests
        working-directory: windows/launcher
        run: python -m pytest tests

      - name: Build Windows FSR edition
        working-directory: windows/launcher
        run: bash build.sh fsr

      - name: Build Windows non-FSR edition
        working-directory: windows/launcher
        run: bash build.sh nofsr

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Driveclub-Windows-Launchers
          path: |
            windows/launcher/dist/fsr/DriveClub.exe
            windows/launcher/dist/nofsr/DriveClub.exe
          if-no-files-found: error
          retention-days: 14
